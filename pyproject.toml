[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.mypy]
plugins = ["pydantic.mypy"]

# asyncpg ships no type information.
[[tool.mypy.overrides]]
module = "asyncpg.*"
ignore_missing_imports = true
